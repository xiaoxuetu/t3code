name: Publish verified Workbench macOS preview 8
on:
  push:
    branches: [release/workbench-preview-8]
    paths: [.github/workflows/publish-workbench-preview-8.yml]
permissions: {}
concurrency:
  group: publish-workbench-preview-8
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'xiaoxuetu/t3code' && github.ref == 'refs/heads/release/workbench-preview-8'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: xiaoxuetu/t3code
      SOURCE_SHA: 1b43fdff87de83b8f4fdd2c242009a7d6e073087
      SOURCE_RUN: '43436232622'
      ARTIFACT_ID: '14044265573'
      ARTIFACT_SHA256: 8a22b3556e05916797a0a61e526aafe24d36ac59deffda996eaa147f01868ae0
      RELEASE_TAG: v0.1.0-workbench.8
    steps:
      - name: Check exact build job and successful independent isolation run
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" > artifact.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN/jobs" > jobs.json
          gh api "repos/$GH_REPO/actions/runs/43442004268" > isolation-run.json
          gh api "repos/$GH_REPO/actions/artifacts/14047436163" > isolation-artifact.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('run.json')); a=json.load(open('artifact.json'))
          assert r['status']=='completed' and r['conclusion']=='failure'
          jobs=json.load(open('jobs.json'))['jobs']
          assert any(j['id']==131923002529 and j['name']=='mac_arm64' and j['conclusion']=='success' for j in jobs)
          ir=json.load(open('isolation-run.json')); ia=json.load(open('isolation-artifact.json'))
          assert ir['status']=='completed' and ir['conclusion']=='success'
          assert ir['head_sha']=='1e5428ddde15fcac16fdcb57f33f72afc99c4468'
          assert ir['repository']['full_name']==os.environ['GH_REPO'] and ir['head_repository']['full_name']==os.environ['GH_REPO']
          assert ia['workflow_run']['id']==43442004268 and not ia['expired']
          assert ia['digest']=='sha256:7b889bbcc727e2a1798a6a8567a9d79612d60170918fd11140615399236893fb'
          assert r['head_sha']==os.environ['SOURCE_SHA']
          assert r['repository']['full_name']==os.environ['GH_REPO']
          assert r['head_repository']['full_name']==os.environ['GH_REPO']
          assert a['workflow_run']['id']==int(os.environ['SOURCE_RUN'])
          assert a['workflow_run']['head_sha']==os.environ['SOURCE_SHA']
          assert a['name']=='t3-pstack-workbench-macos-arm64' and not a['expired']
          assert a['digest']=='sha256:'+os.environ['ARTIFACT_SHA256']
          PY
      - name: Download and verify artifact without executing its contents
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          def digest(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
            return h.hexdigest()
          assert digest('artifact.zip')==os.environ['ARTIFACT_SHA256']
          out=pathlib.Path('release'); out.mkdir()
          with zipfile.ZipFile('artifact.zip') as z:
            selected=[i for i in z.infolist() if i.filename.startswith('release-workbench-macos/') and not i.is_dir() and (i.filename.endswith(('.dmg','.zip')) or pathlib.PurePosixPath(i.filename).name in ('SHA256SUMS','VALIDATION.json'))]
            assert len(selected)==4, [i.filename for i in selected]
            names=[pathlib.PurePosixPath(i.filename).name for i in selected]
            assert len(set(names))==4
            for i, name in zip(selected,names):
              assert re.fullmatch(r'[A-Za-z0-9_. -]+',name) and not name.startswith('.')
              (out/name).write_bytes(z.read(i))
          v=json.load(open(out/'VALIDATION.json'))
          assert v['sourceCommit']==os.environ['SOURCE_SHA'] and v['platform']=='darwin' and v['arch']=='arm64'
          assert v['packagedStartup']=='passed' and v['fixtureThread']=='passed' and v['teamPlanMetadata']=='passed'
          lines=(out/'SHA256SUMS').read_text().splitlines(); assert len(lines)==2
          expected=set()
          for line in lines:
            sha,name=line.split('  ',1)
            assert pathlib.Path(name).name==name and name.endswith(('.dmg','.zip'))
            assert digest(out/name)==sha
            expected.add(name)
          assert expected=={p.name for p in out.iterdir() if p.suffix in ('.dmg','.zip')}
          assert expected=={'T3-Pstack-Workbench-0.1.0-workbench.8-arm64.dmg','T3-Pstack-Workbench-0.1.0-workbench.8-arm64.zip'}
          assert digest(out/'T3-Pstack-Workbench-0.1.0-workbench.8-arm64.dmg')=='a371f6518bf38ea7450d5ba2e7846c56a09201cbde1357e5cbd8bbafdef93860'
          PY
      - name: Verify fixed isolation evidence without executing artifact contents
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/14047436163/zip" > isolation.zip
          gh api "repos/$GH_REPO/actions/artifacts/14044320567/zip" > ui.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          assert hashlib.sha256(pathlib.Path('isolation.zip').read_bytes()).hexdigest()=='7b889bbcc727e2a1798a6a8567a9d79612d60170918fd11140615399236893fb'
          assert hashlib.sha256(pathlib.Path('ui.zip').read_bytes()).hexdigest()=='f94e8e4e8e57445b8c91d9dcf6c4782744f743de2717f28e207b488af54761e5'
          with zipfile.ZipFile('isolation.zip') as z:
            assert sorted(z.namelist())==['RESULT.json','SIGNATURES.json','SOURCE-DIGESTS.json']
            result=json.loads(z.read('RESULT.json')); source=json.loads(z.read('SOURCE-DIGESTS.json')); signatures=json.loads(z.read('SIGNATURES.json'))
            assert result['status']=='passed' and result['failureCode'] is None
            assert result['versions']=={'official':'0.1.9','workbench':'0.1.0-workbench.8'}
            c=result['checks']
            for key in ['freshDefaultPathsOwned','officialWarmupClosedBeforeSnapshot','forkOnlyOfficialSnapshotUnchanged','twoRealAppsAndBackendsAlive','independentTitlesPersistedAcrossRestart','ownedRootsCleaned']:
              assert c[key] is True, key
            assert c['officialMetadataChangesDuringForkOnly']==0 and c['cleanupDeferredToRunnerDestruction'] is False
            assert source['binarySourceCommit']=='1b43fdff87de83b8f4fdd2c242009a7d6e073087'
            assert source['testSourceCommit']=='1e5428ddde15fcac16fdcb57f33f72afc99c4468'
            assert source['buildRunId']==43436232622 and source['artifactId']==14044265573
            assert source['workbenchVersion']=='0.1.0-workbench.8'
            assert source['verified']['workbench']=={'sha256':'a371f6518bf38ea7450d5ba2e7846c56a09201cbde1357e5cbd8bbafdef93860','matched':True}
            assert signatures['strictIntegrity']=={'official':True,'workbench':True}
            for original,target in [('RESULT.json','ISOLATION.json'),('SOURCE-DIGESTS.json','SOURCE-DIGESTS.json'),('SIGNATURES.json','SIGNATURES.json')]:
              pathlib.Path('release',target).write_bytes(z.read(original))
          with zipfile.ZipFile('ui.zip') as z:
            ui=json.loads(z.read('launch/team-plan.json'))
            assert ui['pass'] is True and ui['status']=='passed' and ui['expectedVersion']=='0.1.0-workbench.8'
            assert ui['checks']['metadataUiVerified'] and ui['checks']['restartedStoredPlanVerified']
            pathlib.Path('release/TEAM-PLAN.json').write_bytes(z.read('launch/team-plan.json'))
          PY
      - name: Write accurate prerelease notes
        shell: bash
        run: |
          cat > NOTES.md <<'EOF'
          ## T3 + pstack Workbench 工程预览 0.1.0-workbench.8
          适用于 Apple Silicon Mac（arm64），不是稳定版或完整自动团队验收。

          新增持久任务计划、编辑/优先级/依赖/用户确认、本地任务派发与员工会话绑定、历史执行链接，以及成功验收与失败/阻塞记录分离。

          ### 验证与证据链
          - 原构建 run 43436232622 的 mac_arm64 job 成功：原生构建、定向回归、应用启动、任务计划界面编辑/确认和重启保存通过。
          - 原 run 整体失败，因为首次共存测试在官方应用预热阶段失败。没有把原 run 宣称为全成功，也没有替换二进制。
          - 独立 run 43442004268 使用同一个 .8 DMG，校验 SHA256 后完整验证默认目录、双应用共存及重启保存，通过。测试源码为 1e5428ddde15fcac16fdcb57f33f72afc99c4468。
          - 发布前重新校验包与独立证据摘要；附件保留原 VALIDATION.json（其中共存为待单独 job 验证）并补充 ISOLATION.json、SOURCE-DIGESTS.json、SIGNATURES.json、TEAM-PLAN.json。

          ### 限制
          - Codex、Antigravity、Qoder 的真实自动拆分、员工执行和验收汇总尚未端到端验证。模拟测试和界面验收不代表真实组队已验证。
          - 仅 ad-hoc 签名，无 Developer ID 信任或 Apple 公证；下载后的 Gatekeeper 行为未验证，首次打开可能被阻止。请勿关闭系统安全机制。
          - 本次只支持本地计划派发；长期角色、成员记忆、远端计划联动未实现。其他平台不在本包验证范围。
          - 共存检查限于自有测试目录与明确进程/数据库，不证明全文件系统隔离，也未检查凭据或外部模型账户。

          二进制源码：1b43fdff87de83b8f4fdd2c242009a7d6e073087
          构建：https://github.com/xiaoxuetu/t3code/actions/runs/43436232622
          独立共存验收：https://github.com/xiaoxuetu/t3code/actions/runs/43442004268
          DMG SHA256：a371f6518bf38ea7450d5ba2e7846c56a09201cbde1357e5cbd8bbafdef93860
          EOF
      - name: Create draft, upload exact verified files, then publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace assets automatically.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --prerelease --latest=false --title 'T3 Pstack Workbench 0.1.0-workbench.8 · macOS arm64 preview' --notes-file NOTES.md
          gh release upload "$RELEASE_TAG" release/*
          gh release view "$RELEASE_TAG" --json assets > uploaded.json
          python3 - <<'PY'
          import json, pathlib
          a=json.load(open('uploaded.json'))['assets']
          expected={p.name:p.stat().st_size for p in pathlib.Path('release').iterdir()}
          assert len(a)==8 and {x['name']:x['size'] for x in a}==expected
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
