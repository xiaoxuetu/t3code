name: Validate pinned .8 Mac default paths and coexistence

on:
  push:
    branches: [workbench/mac-preview]
    paths:
      - .github/workflows/workbench-macos-isolation.yml
      - scripts/verify-macos-workbench-isolation.ts
      - scripts/lib/mac-isolation-*.ts
      - scripts/lib/desktop-fixture-ui*.ts
  workflow_dispatch:
    inputs:
      allow_dependency_execution:
        description: Allow the pinned .8 build and official app to run with synthetic data on a fresh disposable Mac
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-macos-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  default_paths_and_coexistence:
    if: >-
      github.repository == 'xiaoxuetu/t3code' &&
      github.ref == 'refs/heads/workbench/mac-preview' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.allow_dependency_execution))
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VP_REMOTE_CACHE: "off"
      VP_REMOTE_CACHE_URL: "http://127.0.0.1:9"
    steps:
      - name: Initialize private dependency configuration
        shell: bash
        run: |
          set -euo pipefail
          config_root="$RUNNER_TEMP/workbench-isolation-dependencies-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$config_root"
          touch "$config_root/npm-user.npmrc" "$config_root/npm-global.npmrc"
          printf 'NPM_CONFIG_USERCONFIG=%s/npm-user.npmrc\n' "$config_root" >> "$GITHUB_ENV"
          printf 'NPM_CONFIG_GLOBALCONFIG=%s/npm-global.npmrc\n' "$config_root" >> "$GITHUB_ENV"
          printf 'NPM_CONFIG_CACHE=%s/npm-cache\n' "$config_root" >> "$GITHUB_ENV"
      - name: Checkout public test source without persisted credentials
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git init .
          git -c credential.helper= remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c credential.helper= fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - name: Download the fixed GUI-validated .8 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: "14044265573"
          run-id: "43436232622"
          repository: xiaoxuetu/t3code
          github-token: ${{ github.token }}
          path: workbench-build-input
          digest-mismatch: error
      - name: Setup locked host test dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter=@t3tools/scripts...
      - name: Typecheck host tests
        working-directory: scripts
        shell: bash
        run: ../node_modules/.bin/effect-tsgo tsrs --noEmit
      - name: Verify synthetic guards and observation helpers
        working-directory: scripts
        shell: bash
        run: vp test run --config ../vite.config.ts --dir . lib/mac-isolation-workspace.test.ts lib/mac-isolation-process.test.ts lib/desktop-fixture-ui.test.ts lib/mac-workbench-build-input.test.ts
      - name: Verify fixed build provenance and both DMGs before any app execution
        shell: bash
        run: |
          set -euo pipefail
          isolation_root="$RUNNER_TEMP/t3-workbench-isolation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$isolation_root"
          printf 'WORKBENCH_ISOLATION_ROOT=%s\n' "$isolation_root" >> "$GITHUB_ENV"
          mkdir -p macos-isolation-validation
          curl --fail --location --retry 2 --output "$isolation_root/official.dmg" https://github.com/pingdotgg/t3code/releases/download/v0.1.9/T3-Code-0.1.9-arm64.dmg
          export WORKBENCH_ISOLATION_INPUT="$isolation_root"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { createHash } from "node:crypto";
          import { resolveBuiltWorkbenchDmg } from "./scripts/lib/mac-workbench-build-input.ts";
          const workbenchVersion = "0.1.0-workbench.8";
          const binarySourceCommit = "1b43fdff87de83b8f4fdd2c242009a7d6e073087";
          const testSourceCommit = process.env.GITHUB_SHA;
          if (!/^[0-9a-f]{40}$/.test(testSourceCommit ?? "")) throw new Error("Invalid test source commit");
          const input = "workbench-build-input/release-workbench-macos";
          const manifest = JSON.parse(fs.readFileSync(path.join(input, "VALIDATION.json"), "utf8"));
          if (manifest.sourceCommit !== binarySourceCommit || manifest.platform !== "darwin" || manifest.arch !== "arm64" || manifest.packagedStartup !== "passed" || manifest.fixtureThread !== "passed" || manifest.teamPlanMetadata !== "passed" || manifest.teamWorkflow !== "not verified with real provider") throw new Error("Pinned build validation manifest mismatch");
          const realProviders = {codex: "not verified", antigravity: "not verified", qoder: "not verified"};
          if (manifest.realProviders === null || typeof manifest.realProviders !== "object" || Object.keys(manifest.realProviders).sort().join(",") !== "antigravity,codex,qoder" || Object.entries(realProviders).some(([provider, expected]) => manifest.realProviders[provider] !== expected)) throw new Error("Pinned provider validation scope mismatch");
          const built = resolveBuiltWorkbenchDmg({version: workbenchVersion, filenames: fs.readdirSync(input), checksumText: fs.readFileSync(path.join(input, "SHA256SUMS"), "utf8")});
          const expected = {official: "b0a15cb7aac2461425f670b14ac52d7a207a0e2008250882c850b4cd62aa926a", workbench: "a371f6518bf38ea7450d5ba2e7846c56a09201cbde1357e5cbd8bbafdef93860"};
          if (built === null || built.sha256 !== expected.workbench) throw new Error("Pinned Workbench checksum manifest mismatch");
          const hash = async (filename) => {
            const h = createHash("sha256");
            for await (const chunk of fs.createReadStream(filename)) h.update(chunk);
            return h.digest("hex");
          };
          if (await hash(path.join(process.env.WORKBENCH_ISOLATION_INPUT, "official.dmg")) !== expected.official) throw new Error("Pinned official asset digest mismatch");
          const builtDmg = path.join(input, built.fileName);
          if (await hash(builtDmg) !== expected.workbench) throw new Error("Pinned Workbench asset digest mismatch");
          fs.copyFileSync(builtDmg, path.join(process.env.WORKBENCH_ISOLATION_INPUT, "workbench.dmg"));
          const verified = {official: {sha256: expected.official, matched: true}, workbench: {sha256: expected.workbench, matched: true}};
          const fixtureSha256 = await hash("scripts/fixtures/desktop-launch/statev2.sqlite");
          if (fixtureSha256 !== "e65f15f89a847a264cf4366cd7bcdc31cef1d5fbfd07707ed497cc0f045357b5") throw new Error("Pinned synthetic fixture digest mismatch");
          fs.writeFileSync("macos-isolation-validation/SOURCE-DIGESTS.json", JSON.stringify({officialVersion: "0.1.9", workbenchVersion, binarySourceCommit, testSourceCommit, buildRunId: 43436232622, artifactId: 14044265573, fixtureSha256, verified, realProviders, teamWorkflow: "not verified with real provider"}, null, 2)+"\n");
          JS
      - name: Run real default-path and concurrent-app checks
        shell: bash
        run: |
          set -euo pipefail
          official_mount="$WORKBENCH_ISOLATION_ROOT/official-volume"
          workbench_mount="$WORKBENCH_ISOLATION_ROOT/workbench-volume"
          mkdir "$official_mount" "$workbench_mount"
          cleanup_volumes() {
            hdiutil detach "$workbench_mount" || true
            hdiutil detach "$official_mount" || true
          }
          trap cleanup_volumes EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$official_mount" "$WORKBENCH_ISOLATION_ROOT/official.dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$workbench_mount" "$WORKBENCH_ISOLATION_ROOT/workbench.dmg"
          export OFFICIAL_ISOLATION_MOUNT="$official_mount"
          export FORK_ISOLATION_MOUNT="$workbench_mount"
          official_app=$(node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const a=fs.readdirSync(process.env.OFFICIAL_ISOLATION_MOUNT).filter(n=>n.endsWith(".app")); if(a.length!==1) throw new Error("Expected one official app"); process.stdout.write(path.join(process.env.OFFICIAL_ISOLATION_MOUNT,a[0]))')
          workbench_app=$(node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const a=fs.readdirSync(process.env.FORK_ISOLATION_MOUNT).filter(n=>n.endsWith(".app")); if(a.length!==1) throw new Error("Expected one Workbench app"); process.stdout.write(path.join(process.env.FORK_ISOLATION_MOUNT,a[0]))')
          official_installed="$WORKBENCH_ISOLATION_ROOT/official-app/$(basename "$official_app")"
          workbench_installed="$WORKBENCH_ISOLATION_ROOT/workbench-app/$(basename "$workbench_app")"
          mkdir -m 700 "$WORKBENCH_ISOLATION_ROOT/official-app" "$WORKBENCH_ISOLATION_ROOT/workbench-app"
          ditto "$official_app" "$official_installed"
          ditto "$workbench_app" "$workbench_installed"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$official_installed/Contents/Info.plist")" = com.t3tools.t3code
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$workbench_installed/Contents/Info.plist")" = org.t3pstack.workbench
          official_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$official_installed/Contents/Info.plist")
          workbench_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$workbench_installed/Contents/Info.plist")
          test "$(lipo -archs "$official_installed/Contents/MacOS/$official_executable")" = arm64
          test "$(lipo -archs "$workbench_installed/Contents/MacOS/$workbench_executable")" = arm64
          export OFFICIAL_ISOLATION_APP="$official_installed"
          export FORK_ISOLATION_APP="$workbench_installed"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          const verified = {};
          for (const [kind, app] of [["official", process.env.OFFICIAL_ISOLATION_APP], ["workbench", process.env.FORK_ISOLATION_APP]]) {
            const fd = fs.openSync(path.join(process.env.WORKBENCH_ISOLATION_ROOT, `${kind}-signature-local.txt`), "w", 0o600);
            try { verified[kind] = spawnSync("/usr/bin/codesign", ["--verify", "--deep", "--strict", app], {stdio: ["ignore", fd, fd], timeout: 60000}).status === 0; }
            finally { fs.closeSync(fd); }
          }
          fs.writeFileSync("macos-isolation-validation/SIGNATURES.json", JSON.stringify({strictIntegrity: verified}, null, 2)+"\n");
          if (!verified.official || !verified.workbench) process.exitCode = 1;
          JS
          node scripts/verify-macos-workbench-isolation.ts --official-executable "$official_installed/Contents/MacOS/$official_executable" --workbench-executable "$workbench_installed/Contents/MacOS/$workbench_executable" --workbench-version 0.1.0-workbench.8 --artifacts-dir macos-isolation-validation
      - name: Upload fixed isolation evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-macos-pinned-8-default-paths-and-coexistence
          path: |
            macos-isolation-validation/RESULT.json
            macos-isolation-validation/SOURCE-DIGESTS.json
            macos-isolation-validation/SIGNATURES.json
          if-no-files-found: ignore
          retention-days: 14
