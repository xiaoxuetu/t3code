name: Workbench Linux validation build

on:
  workflow_dispatch:
    inputs:
      allow_dependency_execution:
        description: "Allow dependency/toolchain downloads and build scripts on this disposable runner"
        type: boolean
        required: true
        default: false
      version:
        description: "Prerelease version for this validation build"
        type: string
        required: true
        default: "0.1.0-workbench.1"

permissions:
  contents: read

jobs:
  linux:
    if: inputs.allow_dependency_execution
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ inputs.version }}
      T3_PSTACK_WORKBENCH_DEV_SEED: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Initialize isolated Workbench state
        shell: bash
        run: |
          set -euo pipefail
          workbench_state="$RUNNER_TEMP/t3-pstack-workbench-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$workbench_state"
          printf 'T3_PSTACK_WORKBENCH_HOME=%s\n' "$workbench_state" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate prerelease version
        shell: bash
        run: |
          node --input-type=module -e 'if (!/^\d+\.\d+\.\d+-workbench\.\d+$/.test(process.env.BUILD_VERSION ?? "")) throw new Error("Use a version such as 0.1.0-workbench.1")'
      - name: Install Linux build libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick patchelf libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Setup pinned workspace toolchain and dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile
      - name: Verify task projection and source provenance
        shell: bash
        run: |
          node --test scripts/verify-team-tasks.test.mjs
          node --experimental-vm-modules --test apps/desktop/scripts/verify-workbench-isolation.mjs
          node integrations/pstack/verify-upstream.mjs
      - name: Typecheck web and desktop
        shell: bash
        run: |
          vp exec --filter @t3tools/web -- effect-tsgo tsrs --noEmit
          vp exec --filter @t3tools/desktop -- effect-tsgo tsrs --noEmit
          vp exec --filter t3 -- effect-tsgo tsrs --noEmit
      - name: Build unsigned Linux AppImage
        shell: bash
        run: |
          vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "$BUILD_VERSION" --output-dir release-workbench --verbose
      - name: Record checksums
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readdir, readFile, writeFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          const names = (await readdir("release-workbench")).filter((name) => name.endsWith(".AppImage")).sort();
          if (names.length === 0) throw new Error("No AppImage was built");
          const rows = await Promise.all(names.map(async (name) => `${createHash("sha256").update(await readFile(`release-workbench/${name}`)).digest("hex")}  ${name}`));
          await writeFile("release-workbench/SHA256SUMS", `${rows.join("\n")}\n`);
          JS
      - name: Upload validation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3-pstack-workbench-linux-x64
          path: |
            release-workbench/*.AppImage
            release-workbench/SHA256SUMS
            LICENSE
            integrations/pstack/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
